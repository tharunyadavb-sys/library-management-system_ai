<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AI Library</title>
    <link rel="stylesheet" href="modern-style.css">
    <style>
        .dashboard-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            background: #f8fafc;
        }
        
        .sidebar {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }
        
        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .main-content {
            padding: 2rem;
            overflow-y: auto;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .dashboard-header h1 {
            font-size: 2rem;
            color: #0f172a;
        }
        
        .logout-btn {
            padding: 0.5rem 1rem;
            background: #f43f5e;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.3);
        }
        
        .content-section {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
        }
        
        .section-title {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .book-list {
            display: grid;
            gap: 1rem;
        }
        
        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 0.75rem;
            border-left: 4px solid #6366f1;
            transition: all 0.3s ease;
        }
        
        .book-item:hover {
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
            transform: translateX(4px);
        }
        
        .book-info h4 {
            margin: 0 0 0.5rem 0;
            color: #0f172a;
        }
        
        .book-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
        }
        
        .book-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .book-actions button {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-delete {
            background: #f43f5e;
            color: white;
        }
        
        .btn-delete:hover {
            background: #e11d48;
            transform: translateY(-2px);
        }
        
        .btn-edit {
            background: #0ea5e9;
            color: white;
        }
        
        .btn-edit:hover {
            background: #0284c7;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .book-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .book-actions {
                width: 100%;
            }
            
            .book-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">📚 AI Library</div>
        <ul class="sidebar-menu">
            <li class="sidebar-link active" onclick="showSection('add-book')">➕ Add Book</li>
            <li class="sidebar-link" onclick="showSection('all-books')">📖 All Books</li>
            <li class="sidebar-link" onclick="logout()">🚪 Logout</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Add Book Section -->
        <div id="add-book" class="content-section">
            <div class="section-title">📝 Add New Book</div>
            
            <form onsubmit="handleAddBook(event)">
                <div class="form-section">
                    <div class="form-group">
                        <label>Book Title</label>
                        <input type="text" id="title" placeholder="Enter book title" required>
                    </div>
                    <div class="form-group">
                        <label>Author Name</label>
                        <input type="text" id="author" placeholder="Enter author name" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="category" placeholder="e.g., Fiction, Science" required>
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="stock" placeholder="Number of copies" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Add Book</button>
            </form>
        </div>

        <!-- All Books Section -->
        <div id="all-books" class="content-section" style="display: none;">
            <div class="section-title">📚 Library Books</div>
            
            <button class="btn btn-primary" onclick="loadBooks()" style="margin-bottom: 1.5rem;">Load Books</button>
            
            <div id="bookList" class="book-list"></div>
        </div>
    </div>
</div>

<script>
// ================= ROLE CHECK =================
const role = localStorage.getItem("role");

if (role !== "admin") {
    alert("Access denied");
    window.location.href = "login.html";
}

// ================= ADD BOOK =================
async function handleAddBook(event) {
    event.preventDefault();

    const title = document.getElementById("title").value;
    const author = document.getElementById("author").value;
    const category = document.getElementById("category").value;
    const stock = document.getElementById("stock").value;

    if (!title || !author || !category || !stock) {
        alert("Fill all fields");
        return;
    }

    await fetch("http://localhost:3000/addBook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, author, category, stock })
    });

    alert("Book added successfully!");

    document.querySelector("form").reset();
    loadBooks();
}

// ================= LOAD BOOKS =================
async function loadBooks() {
    const res = await fetch("http://localhost:3000/getBooks");
    const books = await res.json();

    const list = document.getElementById("bookList");
    list.innerHTML = "";

    if (books.length === 0) {
        list.innerHTML = "<p>No books available</p>";
        return;
    }

    books.forEach(book => {
        const div = document.createElement("div");
        div.className = "book-item";

        div.innerHTML = `
            <div class="book-info">
                <h4>${book.title}</h4>
                <p><b>Author:</b> ${book.author}</p>
                <p><b>Category:</b> ${book.category}</p>
                <p><b>Stock:</b> ${book.stock}</p>
            </div>
            <div class="book-actions">
                <button class="btn-delete" onclick="deleteBook('${book._id}')">Delete</button>
            </div>
        `;

        list.appendChild(div);
    });
}

// ================= DELETE BOOK =================
async function deleteBook(id) {
    await fetch(`http://localhost:3000/deleteBook/${id}`, {
        method: "DELETE"
    });

    alert("Book deleted");
    loadBooks();
}

// ================= NAVIGATION =================
function showSection(sectionId) {
    document.getElementById("add-book").style.display = "none";
    document.getElementById("all-books").style.display = "none";

    document.getElementById(sectionId).style.display = "block";

    if (sectionId === "all-books") {
        loadBooks();
    }
}

// ================= LOGOUT =================
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

// ================= DEFAULT LOAD =================
window.onload = () => {
    showSection("add-book");
};
</script>

</body>
</html>
