<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - AI Library</title>
    <link rel="stylesheet" href="modern-style.css">
    <style>
        .dashboard-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            background: #f8fafc;
        }
        
        .sidebar {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            color: white;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.2);
        }
        
        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .main-content {
            padding: 2rem;
            overflow-y: auto;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .dashboard-header h1 {
            font-size: 2rem;
            color: #0f172a;
        }
        
        .logout-btn {
            padding: 0.5rem 1rem;
            background: #f43f5e;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.3);
        }
        
        .content-section {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
        }
        
        .section-title {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 1.5rem;
        }
        
        .form-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 0.75rem;
            border-left: 4px solid #10b981;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .book-item:hover {
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
            transform: translateX(4px);
        }
        
        .book-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-right: 1rem;
        }
        
        .book-info {
            flex: 1;
        }
        
        .book-info h4 {
            margin: 0 0 0.5rem 0;
            color: #0f172a;
        }
        
        .book-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
        }
        
        .book-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-return {
            padding: 0.5rem 1rem;
            background: #f43f5e;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        
        .btn-return:hover {
            background: #e11d48;
            transform: translateY(-2px);
        }
        
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .book-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">📚 AI Library</div>
        <ul class="sidebar-menu">
            <li class="sidebar-link active" onclick="showSection('browse')">🔍 Browse Books</li>
            <li class="sidebar-link" onclick="showSection('borrowed')">📖 My Books</li>
            <li class="sidebar-link" onclick="showSection('history')">📜 History</li>
            <li class="sidebar-link" onclick="logout()">🚪 Logout</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="dashboard-header">
            <h1>Student Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Browse Books Section -->
        <div id="browse" class="content-section">
            <div class="section-title">🔍 Browse & Borrow Books</div>
            
            <div class="form-section">
                <div class="form-group">
                    <label>From Date</label>
                    <input type="date" id="fromDate" required>
                </div>
                <div class="form-group">
                    <label>To Date</label>
                    <input type="date" id="toDate" required>
                </div>
            </div>

            <button class="btn btn-primary" onclick="loadBooks()" style="margin-bottom: 1.5rem;">Load Available Books</button>
            
            <div id="bookList"></div>
            
            <button class="btn btn-primary" onclick="borrowBooks()" style="margin-top: 1.5rem; width: 100%;">Borrow Selected Books</button>
        </div>

        <!-- My Books Section -->
        <div id="borrowed" class="content-section" style="display: none;">
            <div class="section-title">📖 My Borrowed Books</div>
            
            <button class="btn btn-primary" onclick="loadMyBooks()" style="margin-bottom: 1.5rem;">Load My Books</button>
            
            <div id="myBooks"></div>
        </div>

        <!-- History Section -->
        <div id="history" class="content-section" style="display: none;">
            <div class="section-title">📜 Borrowing History</div>
            
            <button class="btn btn-primary" onclick="loadHistory()" style="margin-bottom: 1.5rem;">Load History</button>
            
            <div id="historyList"></div>
        </div>
    </div>
</div>

<script>
// ================= AUTH CHECK =================
const role = localStorage.getItem("role");

if (role !== "student") {
    alert("Access denied");
    window.location.href = "login.html";
}

// ================= LOAD BOOKS =================
async function loadBooks() {
    const res = await fetch("http://localhost:3000/getBooks");
    const books = await res.json();

    const list = document.getElementById("bookList");
    list.innerHTML = "";

    if (books.length === 0) {
        list.innerHTML = "<p>No books available</p>";
        return;
    }

    books.forEach(book => {
        const div = document.createElement("div");
        div.className = "book-item";

        div.innerHTML = `
            <input type="checkbox" class="book-checkbox" value="${book._id}">
            <div class="book-info">
                <h4>${book.title}</h4>
                <p>${book.author}</p>
            </div>
        `;

        list.appendChild(div);
    });
}

// ================= BORROW MULTIPLE =================
function borrowBooks() {
    const selected = document.querySelectorAll(".book-checkbox:checked");

    if (selected.length === 0) {
        alert("Select at least one book");
        return;
    }

    alert("Books borrowed (demo)");
}

// ================= NAVIGATION =================
function showSection(sectionId) {
    document.getElementById("browse").style.display = "none";
    document.getElementById("borrowed").style.display = "none";
    document.getElementById("history").style.display = "none";

    document.getElementById(sectionId).style.display = "block";
}

// ================= LOAD MY BOOKS =================
function loadMyBooks() {
    document.getElementById("myBooks").innerHTML =
        "<p>No borrowed books yet (demo)</p>";
}

// ================= LOAD HISTORY =================
function loadHistory() {
    document.getElementById("historyList").innerHTML =
        "<p>No history available (demo)</p>";
}

// ================= LOGOUT =================
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

// ================= DEFAULT LOAD =================
window.onload = () => {
    showSection("browse");
};
</script>
</body>
</html>
