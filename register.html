<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Library</title>
    <link rel="stylesheet" href="modern-style.css">
</head>

<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#f8fafc 0%,#e0e7ff 50%,#f3e8ff 100%);">

<div style="width:100%;max-width:420px;padding:2rem;">
    <div class="card" style="box-shadow:0 20px 25px rgba(0,0,0,0.15);">

        <div style="text-align:center;margin-bottom:2rem;">
            <div style="font-size:3rem;margin-bottom:1rem;">📚</div>
            <h2>Create Account</h2>
        </div>

        <form onsubmit="handleRegister(event)">

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">
                Register
            </button>
        </form>

        <div style="text-align:center;margin-top:1rem;">
            <a href="login.html">Already have account?</a>
        </div>

    </div>
</div>

<script>
async function handleRegister(event) {
    event.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('http://localhost:3000/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });

        const text = await res.text();
        alert(text);

        if (text === "Registered successfully") {
            window.location.href = "login.html";
        }

    } catch (err) {
        console.error(err);
        alert("Registration failed");
    }
}
</script>

</body>
</html>
