<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Library</title>
    <link rel="stylesheet" href="modern-style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #f3e8ff 100%);">

<div style="width: 100%; max-width: 420px; padding: 2rem;">
    <div class="card" style="box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔐</div>
            <h2 style="margin-bottom: 0.5rem;">Reset Password</h2>
            <p style="color: #666; font-size: 0.95rem;">Enter your email to receive a password reset code</p>
        </div>

        <form onsubmit="handleSendOtp(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your registered email" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send OTP</button>
        </form>

        <div id="otpSection" style="display: none; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e2e8f0;">
            <form onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label>Enter OTP</label>
                    <input type="text" id="otp" placeholder="6-digit OTP" required>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Create a new password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
            </form>
        </div>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="login.html" style="color: #6366f1; text-decoration: none; font-size: 0.9rem;">Back to Login</a>
        </div>
    </div>
</div>

<script>
async function handleSendOtp(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value;

    try {
        const res = await fetch('http://localhost:3000/sendOtp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const data = await res.json();
        alert("Your OTP is: " + data.otp);
        document.getElementById('otpSection').style.display = 'block';
    } catch (err) {
        alert("Failed to send OTP. Please try again.");
    }
}

async function handleResetPassword(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value;
    const otp = document.getElementById('otp').value;
    const newPassword = document.getElementById('newPassword').value;

    try {
        const res = await fetch('http://localhost:3000/resetPassword', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp, newPassword })
        });

        const msg = await res.text();
        alert(msg);

        if (msg === "Password updated successfully") {
            window.location.href = "login.html";
        }
    } catch (err) {
        alert("Password reset failed. Please try again.");
    }
}
</script>

</body>
</html>
