<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Library</title>
    <link rel="stylesheet" href="modern-style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #f3e8ff 100%);">

<div style="width: 100%; max-width: 420px; padding: 2rem;">
    <div class="card" style="box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
            <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: #666; font-size: 0.95rem;">Sign in to your AI Library account</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="forgot.html" style="color: #6366f1; text-decoration: none; font-size: 0.9rem; margin-right: 1rem;">Forgot Password?</a>
            <a href="register.html" style="color: #666; text-decoration: none; font-size: 0.9rem;">Create Account</a>
        </div>
    </div>
</div>

<script>
async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
        const res = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        console.log("LOGIN RESPONSE:", data); // 🔍 debug

        if (data.message === "Login successful") {

            // store user info
            localStorage.setItem("role", data.role);
            localStorage.setItem("user", JSON.stringify(data.user));

            // redirect
            if (data.role === "admin") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "student.html";
            }

        } else {
            alert("Invalid email or password");
        }

    } catch (error) {
        console.error(error);
        alert("Server error");
    }
}
</script>
</body>
</html>
